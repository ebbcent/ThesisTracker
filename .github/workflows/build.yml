name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Sélection de Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Xcode utilisé : $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Tests unitaires
        if: hashFiles('ThesisTrackerTests/**') != ''
        run: |
          set -o pipefail
          xcodebuild test \
            -project ThesisTracker.xcodeproj \
            -scheme ThesisTracker \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            | xcbeautify --renderer github-actions || exit 1

      - name: Compilation (Release, Apple Silicon + Intel)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ThesisTracker.xcodeproj \
            -target ThesisTracker \
            -configuration Release \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            | xcbeautify --renderer github-actions

      - name: Signature ad hoc et archive
        id: package
        run: |
          APP="build/Release/Writing Process.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Contents/Info.plist")
          NAME="Writing-Process-${VERSION}-build${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/${NAME}.zip"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*.zip
          retention-days: 30

      - name: Publication (branche main ou tag)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${{ steps.package.outputs.version }}-build${GITHUB_RUN_NUMBER}"
          fi
          gh release create "$TAG" dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "Writing Process ${{ steps.package.outputs.version }} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Compilé automatiquement depuis ${GITHUB_SHA::7}. Installation : voir README." \
            --latest
